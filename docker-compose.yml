# docker compose up -d
# Put secrets in ./.env (HERMES_WEB_TOKEN, API_SERVER_KEY and a model key such as OPENROUTER_API_KEY).
# Then open http://127.0.0.1:8642/?token=<HERMES_WEB_TOKEN>
services:
  hermes:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      HERMES_ALLOWED_HOSTS: "127.0.0.1,localhost"
    volumes:
      - ./data:/data              # config, memory, skills, sessions, cron, workspace
    ports:
      - "127.0.0.1:8642:8080"     # dashboard + API + messaging webhooks (put HTTPS in front to expose it)
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
