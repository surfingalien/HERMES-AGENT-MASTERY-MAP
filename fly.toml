# Fly.io - see docs/DEPLOYMENT.md:
#   fly launch --no-deploy --copy-config   (pick a unique app name)
#   fly volumes create hermes_data --size 5
#   fly secrets set HERMES_WEB_TOKEN=$(openssl rand -hex 24) API_SERVER_KEY=$(openssl rand -hex 24) OPENROUTER_API_KEY=...
#   fly deploy
app = "hermes-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HERMES_PROVIDER = "openrouter"
  HERMES_MODEL = "anthropic/claude-opus-5-5"

[[mounts]]
  source = "hermes_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # scheduled jobs and chat bots need the machine running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
